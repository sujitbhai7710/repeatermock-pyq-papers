name: pyq-agent

# Builds the SSC PYQ database from the raw papers in this repository.
#
#   * code lives on `main` (state/ and database/ are gitignored there)
#   * every run publishes the generated tree to the `pyq-db` checkpoint branch
#
# The provider chain is `agentrouter` (direct) -> `ar-worker` -> `jw-worker` ->
# `justwoker` (see the `providers` block of config/settings.json).  A route that
# answers with a rate-limit / exhaustion signal is skipped for its cooldown and
# the request fails over to the next route for the *same model*; when **no**
# provider can serve that model the request falls back to the next candidate
# model of its role (`debate.proposer_models` / `debate.critic_models`, e.g.
# `deepseek-v4-flash` -> `deepseek-v4-pro` -> `gpt-5.6-sol`).  Only a role with no
# working `(provider, model)` pair at all skips the AI step.
#
# Without any provider secret the job is a no-op dry run: it exits 0 with
# `status=skipped_no_keys` instead of calling the endpoints unauthenticated.
#
# Soft stops and AI outages never fail the job:
#   * rate limiting (exit 3) and the work window (exit 4) checkpoint + publish;
#   * an AI outage completes the deterministic pipeline and exits 0 with
#     `status=ai_unavailable`.
# Only other non-zero exits fail the job.
#
# Publishing: the agent pushes a checkpoint commit to `pyq-db` every
# CHECKPOINT_INTERVAL_SECONDS (900 s) while it runs (`PYQ_GIT_PUSH=1`, see
# agent/gitpush.py) and the final step below repeats the same commit as a safety
# net for a job that died before its first tick.

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Run a single phase (0-5). Empty = full pipeline."
        required: false
        default: ""
      no_ai:
        description: "Skip every LLM step (python extraction only)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: pyq-agent
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  # 5.5 h of work inside a 350 min job budget (leaves room for audit + push)
  MAX_WORK_SECONDS: "19800"
  # checkpoint every 15 minutes so an interrupted job resumes where it stopped
  CHECKPOINT_INTERVAL_SECONDS: "900"
  # ... and publish that checkpoint to the `pyq-db` branch on the same tick, so a
  # killed job never loses more than 15 minutes of work
  PYQ_GIT_PUSH: "1"
  PYQ_DB_BRANCH: "pyq-db"
  LOG_DIR: reports/logs

jobs:
  build-database:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # full history: the checkpoint commit is re-parented onto the existing
          # `pyq-db` tip so every push stays a fast-forward
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt has no active entries: the agent is standard-library
          # only, so this is a no-op install that still fails loudly if the file
          # ever becomes unparseable
          pip install -r requirements.txt

      - name: Preflight (provider keys)
        id: preflight
        env:
          AGENTROUTER_KEYS: ${{ secrets.AGENTROUTER_KEYS }}
          JUSTWOKER_KEYS: ${{ secrets.JUSTWOKER_KEYS }}
          AR_PROXY_TOKEN: ${{ secrets.AR_PROXY_TOKEN }}
          JW_PROXY_TOKEN: ${{ secrets.JW_PROXY_TOKEN }}
          MONID_API_KEY: ${{ secrets.MONID_API_KEY }}
        run: |
          mkdir -p "$LOG_DIR"
          keys_present=false
          routes=0
          for name in AGENTROUTER_KEYS JUSTWOKER_KEYS AR_PROXY_TOKEN JW_PROXY_TOKEN MONID_API_KEY; do
            if [ -n "${!name:-}" ]; then
              echo "$name: present"
              case "$name" in
                AGENTROUTER_KEYS|JUSTWOKER_KEYS|AR_PROXY_TOKEN|JW_PROXY_TOKEN) routes=$((routes + 1)) ;;
              esac
            else
              echo "$name: absent"
            fi
          done
          if [ "$routes" -gt 0 ]; then
            keys_present=true
          fi
          echo "keys=$keys_present" >> "$GITHUB_OUTPUT"
          echo "routes=$routes" >> "$GITHUB_OUTPUT"
          if [ "$keys_present" = "false" ]; then
            {
              echo "## pyq-agent skipped"
              echo
              echo '`status=skipped_no_keys`'
              echo
              echo "No provider secret (AGENTROUTER_KEYS / JUSTWOKER_KEYS / AR_PROXY_TOKEN /"
              echo "JW_PROXY_TOKEN) is configured, so the run is a no-op dry run. Add the"
              echo "secrets to enable the pipeline."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "status=skipped_no_keys"
          fi

      - name: Probe the route matrix
        if: steps.preflight.outputs.keys == 'true'
        continue-on-error: true
        env:
          AGENTROUTER_KEYS: ${{ secrets.AGENTROUTER_KEYS }}
          JUSTWOKER_KEYS: ${{ secrets.JUSTWOKER_KEYS }}
          AR_PROXY_TOKEN: ${{ secrets.AR_PROXY_TOKEN }}
          JW_PROXY_TOKEN: ${{ secrets.JW_PROXY_TOKEN }}
        run: |
          # One tiny completion per configured (provider, model) candidate: this is
          # the diagnosis for "the AI step was skipped" runs — it shows exactly
          # which route can serve the proposer and which can serve the critic.
          # Never fatal, never prints a key (only the pool size).
          python -m agent.cli routes --probe --timeout 30 > "$LOG_DIR/routes.log" 2>&1 || true
          {
            echo "## Route probe (provider × model)"
            echo '```text'
            cat "$LOG_DIR/routes.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the agent
        id: agent
        if: steps.preflight.outputs.keys == 'true'
        env:
          AGENTROUTER_KEYS: ${{ secrets.AGENTROUTER_KEYS }}
          JUSTWOKER_KEYS: ${{ secrets.JUSTWOKER_KEYS }}
          AR_PROXY_TOKEN: ${{ secrets.AR_PROXY_TOKEN }}
          JW_PROXY_TOKEN: ${{ secrets.JW_PROXY_TOKEN }}
          MONID_API_KEY: ${{ secrets.MONID_API_KEY }}
          # optional: overrides the GITHUB_TOKEN that actions/checkout persisted
          PYQ_PUSH_TOKEN: ${{ secrets.PYQ_PUSH_TOKEN }}
        run: |
          set -o pipefail
          # The checkpoint published on `pyq-db` makes `run` resume completed
          # phases, which is what an interrupted job needs — but a scheduled job
          # must rebuild from the source papers (they may have changed), so the
          # cron path passes --fresh and the manual path resumes by default.
          fresh=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            fresh="--fresh"
          fi
          if [ -n "${{ github.event.inputs.phase }}" ]; then
            echo "::group::agent run (phase ${{ github.event.inputs.phase }})"
            python -m agent.cli run --phase "${{ github.event.inputs.phase }}" 2>&1 | tee "$LOG_DIR/agent.log"
          elif [ "${{ github.event.inputs.no_ai }}" = "true" ]; then
            echo "::group::agent run (python extraction only)"
            python -m agent.cli run --no-ai $fresh 2>&1 | tee "$LOG_DIR/agent.log"
          else
            echo "::group::agent run (full pipeline)"
            python -m agent.cli run $fresh 2>&1 | tee "$LOG_DIR/agent.log"
          fi
          code=$?
          echo "::endgroup::"
          echo "exit=$code" | tee -a "$LOG_DIR/agent.log"
          # The CLI already distinguishes the AI outage from a real failure: a run
          # whose AI step could not reach any route exits 0 with
          # status=ai_unavailable, so the exit code alone is enough here.
          # 0 = ok / ai_unavailable, 3 = rate_limited, 4 = time_limit.  The last
          # two are *soft stops*: the run checkpointed and published its progress,
          # so the job stays green and the next scheduled run resumes from the
          # checkpoint.  Every other exit code is a real failure.
          run_status=ok
          if [ -f state/checkpoint.json ]; then
            run_status=$(python -c "import json;print(json.load(open('state/checkpoint.json')).get('status') or 'ok')")
          fi
          echo "run_status=$run_status" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "status=$run_status" >> "$GITHUB_OUTPUT" ;;
            3) echo "status=rate_limited" >> "$GITHUB_OUTPUT" ;;
            4) echo "status=time_limit" >> "$GITHUB_OUTPUT" ;;
            *) echo "status=failed" >> "$GITHUB_OUTPUT" ;;
          esac
          if [ "$code" -eq 0 ] || [ "$code" -eq 3 ] || [ "$code" -eq 4 ]; then
            echo "agent soft stop (exit $code, status=$run_status): checkpoint + database are published"
            exit 0
          fi
          exit "$code"

      - name: Audit the database
        if: always() && steps.preflight.outputs.keys == 'true'
        run: |
          if [ ! -d database ]; then
            echo "database/ not produced – audit skipped" | tee -a "$LOG_DIR/audit.log"
            exit 0
          fi
          set +e
          python -m agent.cli audit 2>&1 | tee "$LOG_DIR/audit.log"
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "## Database audit"
            echo '```text'
            cat "$LOG_DIR/audit.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # non-zero on any structural violation (tools/audit_db.py exits 1)
          exit "$status"

      - name: Publish PROGRESS.md to the job summary
        if: always() && steps.preflight.outputs.keys == 'true'
        run: |
          {
            echo "## PYQ agent progress"
            echo
            python -m tools.ci_summary
            echo
            if [ -f database/_meta/PROGRESS.md ]; then
              cat database/_meta/PROGRESS.md
            else
              echo "_database/_meta/PROGRESS.md was not produced_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyq-agent-logs-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ env.LOG_DIR }}/
            state/checkpoint.json
            state/progress.json
            state/manifest.json
            database/_meta/PROGRESS.md
            database/_meta/coverage.md

      - name: Commit the checkpoint branch (pyq-db)
        if: always() && steps.preflight.outputs.keys == 'true'
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          git config user.name "pyq-agent"
          git config user.email "pyq-agent@users.noreply.github.com"

          # Safety net: the agent already published a checkpoint every 15 minutes
          # while it ran (PYQ_GIT_PUSH=1, agent/gitpush.py), so this step usually
          # finds nothing new — it exists for the job that died before its first
          # tick, and repeats the same re-parent/push logic.
          #
          # interrupted atomic writes leave `.tmp-*.part` siblings behind; never
          # commit them (they are gitignored, but `git add -f` overrides that)
          find state database -name '.tmp-*' -type f -delete 2>/dev/null || true

          # NEVER delete published work. A checkpoint must MERGE with what is already on
          # `pyq-db`: snapshot what this run produced, overlay it on the published tree,
          # and commit the union. (Committing only the run's own tree is what previously
          # wiped the full database tree / grammar leaves / mocks off the branch.)
          rm -rf /tmp/pyq-run-state /tmp/pyq-run-db
          cp -a state /tmp/pyq-run-state
          cp -a database /tmp/pyq-run-db

          if git ls-remote --exit-code --heads origin pyq-db >/dev/null 2>&1; then
            git fetch --depth=1 origin pyq-db
            # 1) bring back every file already published
            git checkout FETCH_HEAD -- state database 2>/dev/null || true
            # 2) overlay this run's fresher files on top of them
            cp -a /tmp/pyq-run-state/. state/
            cp -a /tmp/pyq-run-db/. database/
          fi

          find state database -name '.tmp-*' -type f -delete 2>/dev/null || true
          git add -f state database
          if git diff --cached --quiet; then
            echo "nothing to publish (generated tree unchanged since the last checkpoint push)"
            exit 0
          fi

          # re-parent onto the existing pyq-db tip so the push stays a fast-forward
          if git ls-remote --exit-code --heads origin pyq-db >/dev/null 2>&1; then
            git reset --soft FETCH_HEAD
          fi
          git commit -m "pyq-agent: checkpoint run ${RUN_NUMBER} [skip ci]"
          git push origin HEAD:pyq-db

      - name: Result
        if: always()
        run: |
          if [ "${{ steps.preflight.outputs.keys }}" != "true" ]; then
            echo "status=skipped_no_keys"
          else
            echo "status=${{ steps.agent.outputs.status || 'failed' }}"
          fi
